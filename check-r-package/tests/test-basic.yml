name: Test basic package check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install R and rcmdcheck
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null; then SUDO="sudo -E"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends r-base-core r-base-dev r-cran-rcmdcheck
          Rscript -e 'library(rcmdcheck); cat("rcmdcheck", as.character(packageVersion("rcmdcheck")), "\n")'
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/testpkg
          args: 'c("--no-manual")'
          error-on: '"error"'
      - name: Assert check output exists
        run: |
          LOG="$GITHUB_WORKSPACE/tests/fixtures/testpkg/check/testpkg.Rcheck/00check.log"
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/testpkg/check" || true
          if [ ! -f "$LOG" ]; then
            echo "FAIL: $LOG not found"
            exit 1
          fi
          cat "$LOG"
          if ! grep -q "checking tests" "$LOG"; then
            echo "FAIL: tests were not run"
            exit 1
          fi
          echo "PASS"
      - name: Assert LOGNAME exported to GITHUB_ENV
        run: |
          echo "LOGNAME=$LOGNAME"
          if [ -z "$LOGNAME" ]; then
            echo "FAIL: LOGNAME not set"
            exit 1
          fi
          echo "PASS"
