name: Test custom check-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install R and rcmdcheck
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null; then SUDO="sudo -E"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends r-base-core r-base-dev r-cran-rcmdcheck
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/testpkg
          args: 'c("--no-manual")'
          build_args: '"--no-manual"'
          error-on: '"error"'
          check-dir: '"custom-check-out"'
      - name: Assert custom check dir used
        run: |
          DIR="$GITHUB_WORKSPACE/tests/fixtures/testpkg/custom-check-out"
          ls -la "$DIR" || true
          if [ ! -f "$DIR/testpkg.Rcheck/00check.log" ]; then
            echo "FAIL: check log not found in custom dir"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/tests/fixtures/testpkg/check" ]; then
            echo "FAIL: default 'check' dir should not be created"
            exit 1
          fi
          echo "PASS"
