name: Test failing package check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install R and rcmdcheck
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null; then SUDO="sudo -E"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends r-base-core r-base-dev r-cran-rcmdcheck
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: tests/fixtures/failpkg
          args: 'c("--no-manual")'
          error-on: '"error"'
          upload-results: never
      - name: Assert action failed due to test error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          LOG="$GITHUB_WORKSPACE/tests/fixtures/failpkg/check/failpkg.Rcheck/00check.log"
          if [ ! -f "$LOG" ]; then
            echo "FAIL: $LOG not found"
            exit 1
          fi
          cat "$LOG"
          if ! grep -q "ERROR" "$LOG"; then
            echo "FAIL: expected ERROR in check log"
            exit 1
          fi
          echo "PASS"
