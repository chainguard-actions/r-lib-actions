name: Test custom artifact names (uploads disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install R and rcmdcheck
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null; then SUDO="sudo -E"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends r-base-core r-base-dev r-cran-rcmdcheck
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/testpkg
          args: 'c("--no-manual")'
          error-on: '"error"'
          upload-results: 'false'
          upload-snapshots: 'false'
          artifact-name: my-custom-results
          snapshot-artifact-name: my-custom-snapshots
      - name: Assert check succeeded and output produced
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          LOG="$GITHUB_WORKSPACE/tests/fixtures/testpkg/check/testpkg.Rcheck/00check.log"
          if [ ! -f "$LOG" ]; then
            echo "FAIL: $LOG not found"
            exit 1
          fi
          cat "$LOG"
          echo "PASS"
