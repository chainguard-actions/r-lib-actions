name: 'check-r-package'
description: 'Action to check R package with rcmdcheck. Assumes that rcmdcheck has already been installed.'
author: 'Jim Hester'
inputs:
  args:
    description: 'Arguments to pass to the `args` parameter of rcmdcheck'
    default: '"--no-manual", "--as-cran"'
  build_args:
    description: 'Arguments to pass to the `build_args` parameter of rcmdcheck'
    default: '"--no-manual"'
  error-on:
    description: 'What type of result should cause a build error?'
    default: '"warning"'
  check-dir:
    description: 'Where should the check output go?'
    default: '"check"'
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: "@v1 is deprecated"
      run: |
        echo "::warning title=r-lib/actions/check-r-package@v1 is deprecated.::r-lib/actions/check-r-package@v1 is deprecated. Please update your workflow to use the 'v2' version. Also look at the examples at https://github.com/r-lib/actions/tree/v2/examples because 'v2' workflows are much simpler than 'v1' workflows."
      shell: bash

    - name: Check
      env:
        _R_CHECK_CRAN_INCOMING_: false
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_BUILD_ARGS: ${{ inputs.build_args }}
        INPUT_ERROR_ON: ${{ inputs.error-on }}
        INPUT_CHECK_DIR: ${{ inputs.check-dir }}
      run: |
        options(crayon.enabled = TRUE)
        # Parse an input as the contents of c(...), allowing only literal
        # constants (strings, numbers, logicals, NULL) so no code can run.
        literal_values <- function(var) {
          txt <- Sys.getenv(var)
          exprs <- parse(text = paste0("c(", txt, "\n)"), keep.source = FALSE)
          if (length(exprs) != 1L) stop("Invalid value for ", var)
          e <- exprs[[1L]]
          if (!is.call(e) || !identical(e[[1L]], as.name("c"))) stop("Invalid value for ", var)
          for (a in as.list(e)[-1L]) {
            if (!(is.null(a) || (is.atomic(a) && length(a) == 1L))) {
              stop("Only literal values are allowed in ", var)
            }
          }
          eval(e, baseenv())
        }
        rcmdcheck::rcmdcheck(
          args = literal_values("INPUT_ARGS"),
          build_args = literal_values("INPUT_BUILD_ARGS"),
          error_on = literal_values("INPUT_ERROR_ON"),
          check_dir = literal_values("INPUT_CHECK_DIR")
        )
      shell: Rscript {0}
