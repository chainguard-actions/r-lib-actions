name: Test basic R install (release)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert installed-r-version output is a version
        env:
          ACTUAL: ${{ steps.action.outputs.installed-r-version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: expected x.y.z version"
            exit 1
          fi
          echo "PASS"
      - name: Assert Rscript works and matches the output
        env:
          EXPECTED: ${{ steps.action.outputs.installed-r-version }}
        run: |
          which Rscript
          GOT="$(Rscript -e 'cat(as.character(getRversion()))')"
          echo "Rscript version: $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "FAIL: expected R $EXPECTED"
            exit 1
          fi
          echo "PASS"
      - name: Assert repos option and Ncpus configured via .Rprofile
        run: |
          Rscript -e 'print(getOption("repos")); print(getOption("Ncpus"))'
          NC="$(Rscript -e 'cat(getOption("Ncpus"))')"
          if [ "$NC" != "1" ]; then
            echo "FAIL: expected Ncpus 1, got $NC"
            exit 1
          fi
          CRAN="$(Rscript -e 'cat(getOption("repos")[["CRAN"]])')"
          echo "CRAN: $CRAN"
          if [ "$CRAN" != "https://cran.rstudio.com" ]; then
            echo "FAIL: unexpected CRAN repo"
            exit 1
          fi
          echo "PASS"
