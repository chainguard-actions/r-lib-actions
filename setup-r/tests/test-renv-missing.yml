name: Test r-version renv with missing renv.lock fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SETUP_R_LINUX_PLATFORM: linux-ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          r-version: renv
          working-directory: tests/fixtures/does-not-exist
          install-r: 'false'
          use-public-rspm: 'false'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when renv.lock is missing"
            exit 1
          fi
          echo "PASS"
