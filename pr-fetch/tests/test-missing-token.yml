name: Test missing required repo-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any pre-existing pr remote
        run: git remote remove pr 2>/dev/null || true
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed because repo-token is required
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when repo-token is missing, got '$OUTCOME'"
            exit 1
          fi
          if git remote | grep -qx pr; then
            echo "FAIL: 'pr' remote should not have been added"
            exit 1
          fi
          echo "PASS"
