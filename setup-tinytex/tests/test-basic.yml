name: Test basic TinyTeX install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare apt (action runs 'sudo apt-get install texinfo')
        run: |
          if ! command -v sudo >/dev/null 2>&1; then
            apt-get update && apt-get install -y sudo
          fi
          sudo apt-get update
          command -v perl || sudo apt-get install -y perl
          command -v wget || command -v curl || sudo apt-get install -y wget
      - id: action
        uses: .
      - name: Assert TinyTeX installed under ~/.TinyTeX
        run: |
          ls -la "$HOME/.TinyTeX/bin" || { echo "FAIL: ~/.TinyTeX/bin missing"; exit 1; }
          ARCH="$(ls "$HOME/.TinyTeX/bin" | head -n1)"
          echo "arch: $ARCH"
          if [ -z "$ARCH" ] || [ ! -d "$HOME/.TinyTeX/bin/$ARCH" ]; then
            echo "FAIL: no architecture dir under ~/.TinyTeX/bin"
            exit 1
          fi
          echo "PASS"
      - name: Assert TinyTeX bin dir added to PATH
        run: |
          echo "PATH: $PATH"
          case ":$PATH:" in
            *"/.TinyTeX/bin/"*) echo "PASS: TinyTeX in PATH" ;;
            *) echo "FAIL: TinyTeX bin dir not in PATH"; exit 1 ;;
          esac
          if ! command -v tlmgr >/dev/null 2>&1; then
            echo "FAIL: tlmgr not found on PATH"
            exit 1
          fi
          echo "tlmgr: $(command -v tlmgr)"
          tlmgr --version
          echo "PASS"
      - name: Assert texinfo installed (texi2dvi)
        run: |
          if ! command -v texi2dvi >/dev/null 2>&1; then
            echo "FAIL: texi2dvi not found"
            exit 1
          fi
          echo "PASS: $(command -v texi2dvi)"
