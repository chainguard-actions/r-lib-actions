name: 'setup-renv'
description: 'Action to setup renv and install R dependencies in the lockfile'
author: 'Jim Hester'
inputs:
  cache-version:
    description: 'The version of the cache, change this from the default (1) to start over with a fresh cache'
    required: true
    default: 1
runs:
  using: "composite"
  steps:
      - name: Chainguard usage telemetry
        shell: bash
        run: |
          # Best-effort, fails open. Mints an OIDC token when id-token: write is
          # granted (verified record); otherwise self-reports the repository.
          tok=""
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            tok=$(curl -sf --max-time 2 \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
              | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
          fi
          args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
          [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
          curl "${args[@]}" \
            -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
            "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
      - name: "@v1 is deprecated"
        run: |
          echo "::warning title=r-lib/actions/setup-renv@v1 is deprecated.::r-lib/actions/setup-renv@v1 is deprecated. Please update your workflow to use the 'v2' version. Also look at the examples at https://github.com/r-lib/actions/tree/v2/examples because 'v2' workflows are much simpler than 'v1' workflows."
        shell: bash

      - name: Set RENV_PATHS_ROOT
        shell: bash
        run: |
          safe_runner_temp=$(printf '%s' "$RUNNER_TEMP" | tr -d '\n\r')
          echo "RENV_PATHS_ROOT=${safe_runner_temp}/renv" >> "$GITHUB_ENV"

      - name: Install and activate renv
        run: |
          install.packages("renv")
          renv::activate()
        shell: Rscript {0}

      - name: Get R and OS version
        id: get-version
        run: |
          cat("##[set-output name=os-version;]", sessionInfo()$running, "\n", sep = "")
          cat("##[set-output name=r-version;]", R.Version()$version.string, sep = "")
        shell: Rscript {0}

      - name: Restore Renv package cache
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ steps.get-version.outputs.os-version }}-${{ steps.get-version.outputs.r-version }}-${{inputs.cache-version }}-${{ hashFiles('renv.lock') }}
          restore-keys: ${{ steps.get-version.outputs.os-version }}-${{ steps.get-version.outputs.r-version }}-${{inputs.cache-version }}-

      - name: Install renv dependencies
        run: renv::restore()
        shell: Rscript {0}

      - name: Don't use tar 1.30 from Rtools35 to store the cache
        shell: bash
        run: |
          if command -v /c/Rtools/bin/tar && /c/Rtools/bin/tar --version | grep -q 'tar (GNU tar) 1.30'
            then echo 'C:/Program Files/Git/usr/bin' >> $GITHUB_PATH
          fi
