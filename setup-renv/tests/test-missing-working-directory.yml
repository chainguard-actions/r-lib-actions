name: Test missing working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install R
        run: |
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends r-base-core
          fi
          RHOME="$(R RHOME)"
          echo 'options(repos = c(CRAN = "https://cloud.r-project.org"))' | sudo tee -a "$RHOME/etc/Rprofile.site"
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: tests/fixtures/does-not-exist
          bypass-cache: "true"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent working directory"
            exit 1
          fi
          echo "PASS"
