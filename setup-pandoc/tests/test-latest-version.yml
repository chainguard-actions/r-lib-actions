name: Test latest pandoc version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pandoc-version: latest
      - name: Assert a recent pandoc is on PATH
        run: |
          ACTUAL="$(pandoc --version | head -n1)"
          echo "actual: $ACTUAL"
          VER="${ACTUAL#pandoc }"
          MAJOR="${VER%%.*}"
          if ! echo "$ACTUAL" | grep -qE '^pandoc [0-9]+(\.[0-9]+)+$'; then
            echo "FAIL: unexpected version line"
            exit 1
          fi
          if [ "$MAJOR" -lt 3 ]; then
            echo "FAIL: expected latest pandoc to be >= 3.x"
            exit 1
          fi
          echo "PASS"
