name: Test default pandoc version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert pandoc 3.8.3 is on PATH
        run: |
          which pandoc || { echo "FAIL: pandoc not on PATH"; exit 1; }
          ACTUAL="$(pandoc --version | head -n1)"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "pandoc 3.8.3" ]; then
            echo "FAIL: expected 'pandoc 3.8.3'"
            exit 1
          fi
          echo "PASS"
      - name: Assert pandoc converts markdown
        run: |
          OUT="$(printf '# Hello\n' | pandoc -f markdown -t html)"
          echo "output: $OUT"
          if ! echo "$OUT" | grep -q '<h1 id="hello">Hello</h1>'; then
            echo "FAIL: unexpected conversion output"
            exit 1
          fi
          echo "PASS"
