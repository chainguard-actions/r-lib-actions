name: Test specific pandoc version with token supplied
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pandoc-version: '3.1.11'
          token: ${{ github.token }}
      - name: Assert pandoc 3.1.11 is on PATH
        run: |
          ACTUAL="$(pandoc --version | head -n1)"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "pandoc 3.1.11" ]; then
            echo "FAIL: expected 'pandoc 3.1.11'"
            exit 1
          fi
          echo "PASS"
