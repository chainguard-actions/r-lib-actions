name: Test rchk fails when workspace is not an R package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Make workspace root not an R package (back up DESCRIPTION)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          BK="$RUNNER_TEMP/rchk-backup"
          rm -rf "$BK"; mkdir -p "$BK"
          echo "RCHK_BACKUP=$BK" >> "$GITHUB_ENV"
          if [ -e DESCRIPTION ]; then
            echo "backing up existing DESCRIPTION"
            mv DESCRIPTION "$BK/DESCRIPTION"
          fi
          if [ -e DESCRIPTION ]; then echo "FAIL: DESCRIPTION still present"; exit 1; fi
          echo "workspace root is not an R package"
      - id: action
        uses: .
        continue-on-error: true
        with:
          package: doesnotexist
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no R package is present, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Restore workspace
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -n "$RCHK_BACKUP" ] && [ -e "$RCHK_BACKUP/DESCRIPTION" ]; then
            mv "$RCHK_BACKUP/DESCRIPTION" DESCRIPTION
          fi
