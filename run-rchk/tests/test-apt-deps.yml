name: Test rchk run with apt dependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Stage minimal R package at the workspace root (backing up existing files)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          FIX="$(find "$GITHUB_WORKSPACE" -path '*/tests/fixtures/rpkg/DESCRIPTION' -not -path '*/.git/*' | head -n1)"
          if [ -z "$FIX" ]; then echo "FAIL: fixture package not found"; exit 1; fi
          FIX="$(dirname "$FIX")"
          echo "fixture dir: $FIX"
          BK="$RUNNER_TEMP/rchk-backup"
          rm -rf "$BK"; mkdir -p "$BK"
          echo "RCHK_BACKUP=$BK" >> "$GITHUB_ENV"
          for f in DESCRIPTION NAMESPACE LICENSE R src .Rbuildignore; do
            if [ -e "$f" ]; then
              echo "backing up existing $f"
              mv "$f" "$BK/$f"
            fi
          done
          cp "$FIX/DESCRIPTION" DESCRIPTION
          cp "$FIX/NAMESPACE" NAMESPACE
          cp "$FIX/LICENSE" LICENSE
          cp -r "$FIX/R" R
          cp -r "$FIX/src" src
          cp "$FIX/Rbuildignore" .Rbuildignore
          chmod -R a+rwX R src
      - id: action
        uses: .
        continue-on-error: true
        with:
          apt: jq
          package: rchktest
      - name: Assert action ran (success, or graceful failure due to broken upstream rchk image)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # apt install of jq runs first inside the container; the subsequent
          # R invocation fails because the rhub/ubuntu-rchk image lacks
          # /home/docker/R-svn/bin/exec/R. Require that the action executed.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: rchk succeeded after installing apt deps"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed (upstream rchk image has no working R)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Restore workspace
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf DESCRIPTION NAMESPACE LICENSE R src .Rbuildignore
          if [ -n "$RCHK_BACKUP" ] && [ -d "$RCHK_BACKUP" ]; then
            for f in DESCRIPTION NAMESPACE LICENSE R src .Rbuildignore; do
              if [ -e "$RCHK_BACKUP/$f" ]; then mv "$RCHK_BACKUP/$f" "$f"; fi
            done
          fi
